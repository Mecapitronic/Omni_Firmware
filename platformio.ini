; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = Omni_Firmware
description = Robot Omni Firmware
default_envs = Esp32_NO_WIFI
build_dir = C:/.pio/Omni_Firmware/build
;libdeps_dir = C:/.pio/Omni_Firmware/libdeps

[common]
monitor_speed = 921600
upload_speed = 921600
upload_port = 192.168.137.110

[env]
platform = espressif32@^7.1.3
board = ESP32-S3-Tiny
framework = arduino
upload_protocol = esptool
build_type = debug
board_build.partitions = partitions_usb_no_ota.csv
build_src_filter = 
	+<*>
	-<.git/>
	-<.svn/>
	-<test-simulator/>
	-<test/>
	-<**/*.jpeg>
	-<**/*.txt>
	-<*.jpeg>
	-<*.txt>
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
monitor_filters = 
	colorize
	time
	send_on_enter
	esp32_exception_decoder
monitor_echo = yes
monitor_eol = LF
; on utilise la version 1.0.2 de SparkFun OTOS car elle n'utilise pas la bibliothèque Toolkit qui est bugguée
; La 1.0.2 n'est plus disponible dans le registre PlatformIO : utiliser le tag Git officiel.
lib_deps = 
	Esp32_Helper=symlink://lib/Esp32_Helper
	Dynamixel2Arduino=symlink://lib/Dynamixel2Arduino
	Esp32_Hardware=symlink://lib/Esp32_Hardware
	ESP32_FastPWM=symlink://lib/ESP32_FastPWM
	https://github.com/sparkfun/SparkFun_Qwiic_OTOS_Arduino_Library.git#v1.0.2
	; sparkfun/SparkFun Toolkit@^0.9.2
	adafruit/Adafruit TCS34725@^1.4.4
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=c++17
	-std=gnu++17
	-I config
	-D ARDUINO_ESP32S3_DEV
	-D ARDUINO_USB_MODE=1

[env:Esp32_NO_WIFI]
build_unflags = 
	${env.build_unflags}
build_flags = 
	${env.build_flags}
	-D NO_WIFI
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:Esp32_WOKWI]
build_unflags = 
	-std=gnu++11
build_flags = 
	${env.build_flags}
	-D SIMULATOR
	-D WOKWI
	-D MOCK_SPIFFS
extra_scripts = post:scripts/extra_script.py
; Use it only with SIMULATOR
board_build.embed_txtfiles =
	data/actions.json

[env:Esp32_WITH_WIFI]
build_unflags = 
	${env.build_unflags}
build_flags = 
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D WITH_WIFI
;	-D WITH_OTA